name: Deploy Backend to Heroku

on:
  push:
    branches:
      - develop
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Docker Compose plugin
        uses: docker/setup-compose-action@v1

      - name: Login to Heroku Container Registry
        run: echo ${{ secrets.HEROKU_API_KEY }} | docker login --username=_ --password-stdin registry.heroku.com

      - name: Create .env file from secrets
        run: |
          echo "DD_API_KEY=${{ secrets.DD_API_KEY }}" >> .env

      - name: Set Heroku app name and Dockerfile
        run: |
          echo "HEROKU_APP_NAME=${{ secrets.HEROKU_APP_NAME_BACKEND }}" >> $GITHUB_ENV
          echo "DOCKERFILE=Dockerfile.backend" >> $GITHUB_ENV

      - name: Build and create containers with docker compose
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
        run: |
          # Build and start the backend and dd-agent containers defined in docker-compose.yml
          docker compose -f docker-compose.yml up -d --build backend dd-agent

          # The compose file tags the backend image as 'fiap-fase1-backend:latest' (see docker-compose.yml).
          # Ensure the image exists; if not, build it directly as a fallback.
          if ! docker image inspect fiap-fase1-backend:latest >/dev/null 2>&1; then
            docker build -f Dockerfile.backend -t fiap-fase1-backend:latest .
          fi

          # Tag the backend image for Heroku registry and push
          docker tag fiap-fase1-backend:latest registry.heroku.com/${{ env.HEROKU_APP_NAME }}/web
          docker push registry.heroku.com/${{ env.HEROKU_APP_NAME }}/web

      - name: Install Heroku CLI
        run: |
          curl https://cli-assets.heroku.com/install-ubuntu.sh | sh

      - name: Set Heroku config vars for Datadog APM
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          # Configure Datadog APM for agentless mode (direct to Datadog intake)
          heroku config:set \
            DD_API_KEY="${{ secrets.DD_API_KEY }}" \
            DD_SITE="us5.datadoghq.com" \
            DD_SERVICE="fase-1-backend" \
            DD_ENV="production" \
            DD_VERSION="1.0.0" \
            DD_LOGS_INJECTION="true" \
            DD_TRACE_SAMPLE_RATE="1.0" \
            DD_TRACE_AGENT_URL="https://trace.agent.us5.datadoghq.com" \
            --app ${{ env.HEROKU_APP_NAME }}

      - name: Configure Heroku Log Drain to Datadog
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          DRAIN_URL="syslog+tls://intake.logs.us5.datadoghq.com:10516?token=${{ secrets.DD_API_KEY }}&ddsource=heroku&service=fase-1-backend&ddtags=env:production,site:us5"
          # Add only if not already present
          if ! heroku drains -a ${{ env.HEROKU_APP_NAME }} | grep -q "$DRAIN_URL"; then
            heroku drains:add "$DRAIN_URL" -a ${{ env.HEROKU_APP_NAME }}
          else
            echo "Datadog log drain already configured"
          fi

      - name: Release app on Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          IMAGE_ID=$(docker inspect registry.heroku.com/${{ env.HEROKU_APP_NAME }}/web --format={{.Id}})
          curl -n -X PATCH https://api.heroku.com/apps/${{ env.HEROKU_APP_NAME }}/formation \
            -d '{ "updates": [ { "type": "web", "docker_image": "'"$IMAGE_ID"'" } ] }' \
            -H "Content-Type: application/json" \
            -H "Accept: application/vnd.heroku+json; version=3.docker-releases" \
            -H "Authorization: Bearer $HEROKU_API_KEY"
