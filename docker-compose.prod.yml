services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend.prod
      cache_from:
        - fiap-fase1-backend:prod
    image: fiap-fase1-backend:prod
    container_name: fiap-backend-prod
    hostname: backend-prod
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    env_file:
      - .env.prod
    environment:
      - TZ=America/Sao_Paulo
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=backend,env=prod"
    volumes:
      - ./data:/app/data:rw
      - ./logs:/app/logs:rw
      - ./models:/app/models:rw
      - ./ml_training:/app/ml_training:ro
    command: sh ./start-backend-prod.sh
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:5000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - fiap-prod-network
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 1G
    # Shared memory para Firefox/Selenium
    shm_size: "2gb"
    labels:
      com.fiap.service: "backend"
      com.fiap.environment: "production"
      com.fiap.team: "going-merry"
      com.fiap.version: "1.0.0"

  dd-agent:
    image: gcr.io/datadoghq/agent:7
    container_name: dd-agent
    restart: always
    environment:
      DD_API_KEY: ${DD_API_KEY}
      DD_SITE: us5.datadoghq.com
      DD_DOGSTATSD_NON_LOCAL_TRAFFIC: "true"
      DD_LOGS_ENABLED: "true"
      DD_LOGS_CONFIG_AUTO_MULTI_LINE_DETECTION: "true"
      DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: "true"
      DD_CONTAINER_EXCLUDE_LOGS: "name:dd-agent name:portainer"
    volumes:
      - /opt/datadog-agent/run:/opt/datadog-agent/run:rw
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - fiap-prod-network

networks:
  fiap-prod-network:
    driver: bridge
    name: fiap-fase1-prod-network
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "true"
    labels:
      com.fiap.network: "production"
      com.fiap.team: "going-merry"
